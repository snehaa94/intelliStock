{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}IntelliStock{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="{% static 'inventory/app.css' %}" rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
      defer
    ></script>
    <script src="{% static 'inventory/app.js' %}" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark app-nav">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}"
          >✦ IntelliStock</a
        ><button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="nav" class="collapse navbar-collapse">
          <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'dashboard' %}">Overview</a
            ><a class="nav-link" href="{% url 'products' %}">Products</a
            ><a class="nav-link" href="{% url 'forecast' %}">Forecast</a
            ><a class="nav-link" href="{% url 'assistant' %}">AI Assistant</a
            ><a class="nav-link" href="/admin/">Admin</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      {% if messages %}{% for message in messages %}
      <div
        class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
      >
        {{ message }}<button class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}{% endif %}{% block content %}{% endblock %}
    </main>
    <footer class="container py-4 small text-secondary">
      IntelliStock · Forecasts are estimates, not guarantees.
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </body>
</html>
